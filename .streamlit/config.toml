[theme]
base = "light"
primaryColor = "#14958a"
backgroundColor = "#f2f5f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d2b3b"

[server]
maxUploadSize = 5
runOnSave = true
fileWatcherType = "auto"

[client]
# Oculta el botón "Deploy" de la barra superior para que no se cruce con el chat.
toolbarMode = "minimal"
